# The software factory. All the logic lives in phoibe/factory; this file only forwards events to it.
name: Factory
on:
  issues:
    types: [opened, labeled, closed]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, labeled, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write
  deployments: read
  id-token: write
  actions: read

jobs:
  factory:
    # Cheap filters, so that label changes and the agent's own messages cost no Actions minutes.
    if: >-
      (github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'factory:feature' || github.event.label.name == 'factory:bug') &&
      (github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'factory:checks') &&
      (github.event_name != 'issue_comment' || !contains(github.event.comment.body, '<!-- factory-agent -->'))
    uses: phoibe/factory/.github/workflows/relay.yml@main
    secrets: inherit
