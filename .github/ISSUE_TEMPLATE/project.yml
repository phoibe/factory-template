name: Nouveau projet (cadrage)
description: À faire une fois, avant la première feature. Décris ton idée d'appli en vrac, l'agent te pose ses questions puis propose une stack.
title: "Cadrage : "
labels: ["factory:project"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Ton idée d'appli
      description: Pour qui, pour quoi faire, ce qui te donne envie de la construire. En vrac, avec tes mots.
      placeholder: "Une appli pour suivre mes habitudes : je coche ce que j'ai fait chaque jour et je vois mes séries."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Contraintes ou envies (facultatif)
      description: Sur mobile surtout ? Des comptes ? Des données à partager ?
  - type: textarea
    id: look
    attributes:
      label: Le look que tu imagines (facultatif)
      description: Des applis, sites ou objets dont tu aimes l'allure, et ceux que tu n'aimes pas. L'agent te posera de toute façon ses questions design.
      placeholder: "J'aime le calme de Things et les couleurs de Duolingo ; je n'aime pas les applis bancaires grises."
